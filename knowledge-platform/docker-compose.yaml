version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: ke-postgres
    environment:
      POSTGRES_DB: knowledge_platform
      POSTGRES_USER: ke_user
      POSTGRES_PASSWORD: ke_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ke_user -d knowledge_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ke-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    container_name: ke-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: ke-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ke-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: ke-backend
    depends_on:
      - postgres
      - minio
      - redis
      - elasticsearch
      - qdrant
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://ke_user:ke_password@postgres:5432/knowledge_platform}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-development-only-change-me}
      - CSRF_SECRET_KEY=${CSRF_SECRET_KEY:-development-only-change-me}
      - API_KEY_HMAC_SECRET=${API_KEY_HMAC_SECRET:-development-only-change-me}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:3000}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8000}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_SUCCESS_URL=${STRIPE_SUCCESS_URL:-http://localhost:3000/billing?checkout=success}
      - STRIPE_CANCEL_URL=${STRIPE_CANCEL_URL:-http://localhost:3000/billing?checkout=cancelled}
      - SAAS_PLANS=${SAAS_PLANS:-}
      - DEBUG=${DEBUG:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ke-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - PORT=3000
    ports:
      - "3000:3000"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: ke-worker
    depends_on:
      - postgres
      - minio
      - redis
      - elasticsearch
      - qdrant
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://ke_user:ke_password@postgres:5432/knowledge_platform}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-development-only-change-me}
      - CSRF_SECRET_KEY=${CSRF_SECRET_KEY:-development-only-change-me}
      - API_KEY_HMAC_SECRET=${API_KEY_HMAC_SECRET:-development-only-change-me}
      - DEBUG=${DEBUG:-false}
    volumes:
      - ./workers:/app/workers
    command: python workers/worker.py

volumes:
  postgres_data:
  minio_data:
  redis_data:
  es_data:
  qdrant_data: