global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'airflow'
    static_configs:
      - targets: ['airflow-apiserver:8080']
    metrics_path: '/api/v2/monitor/metrics'

  - job_name: 'postgres'
    static_configs:
      - targets: ['datawarehouse:5432']

  - job_name: 'minio'
    static_configs:
      - targets: ['minio:9000']

  - job_name: 'spark-master'
    static_configs:
      - targets: ['spark-master:8080']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']