[core]
dags_folder = /opt/airflow/dags
base_log_folder = /opt/airflow/logs
plugins_folder = /opt/airflow/plugins
executor = CeleryExecutor
sql_alchemy_conn = postgresql+psycopg2://airflow:airflow@postgres/airflow
load_examples = False
fernet_key = ${FERNET_KEY}
dagbag_import_timeout = 30
dag_file_processor_timeout = 50
task_runner = StandardTaskRunner
default_timezone = UTC

[api]
auth_backends = airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session

[celery]
broker_url = redis://:@redis:6379/0
result_backend = db+postgresql+psycopg2://airflow:airflow@postgres/airflow
worker_concurrency = 4
worker_log_server_port = 8793

[scheduler]
dag_dir_list_interval = 30
print_stats_interval = 30
job_heartbeat_sec = 5
scheduler_heartbeat_sec = 5
run_duration = -1
min_file_process_interval = 10
dag_file_processor_timeout = 50

[webserver]
web_server_host = 0.0.0.0
web_server_port = 8080
secret_key = ${AIRFLOW__API_AUTH__JWT_SECRET}
access_logfile = -
error_logfile = -
access_logformat = %(asctime)s - %(name)s - %(levelname)s - %(message)s
expose_config = False
authenticate = True
auth_manager = airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

[database]
sql_alchemy_conn = postgresql+psycopg2://airflow:airflow@postgres/airflow
sql_alchemy_pool_size = 10
sql_alchemy_max_overflow = 10
sql_alchemy_pool_pre_ping = True

[logging]
logging_level = INFO
fab_logging_level = WARN
log_format = [%%(asctime)s] {%(filename)s:%(lineno)d} %(levelname)s - %(message)s
simple_log_format = [%%(asctime)s] %(levelname)s - %(message)s
log_filename_template = {{ ti.dag_id }}/{{ ti.task_id }}/{{ ti.try_number }}/{{ ts }}.log
log_processor_filename_template = {{ filename }}.log
log_storage_class = airflow.utils.log.file_task_handler.FileTaskHandler

[elasticsearch]
host =

[smtp]
smtp_host = localhost
smtp_starttls = True
smtp_ssl = False
smtp_user = airflow
smtp_password = airflow
smtp_port = 25
smtp_mail_from = airflow@example.com

[openlineage]
# OpenLineage configuration for data lineage tracking
# Requires openlineage-airflow provider
enabled = True
transport = "http"
host = "marquez"
port = 5000
namespace = "data-platform"
# For production, use a proper OpenLineage backend like Marquez, DataHub, or Atlas
# endpoint = "http://marquez:5000/api/v1/lineage"

[lineage]
backend = openlineage

[operators]
default_owner = airflow
default_trigger_rule = all_success
default_depends_on_past = False
default_email_on_retry = False
default_email_on_failure = False
default_retries = 1
default_retry_delay = 300

[task]
task_runner = StandardTaskRunner

[metrics]
statsd_on = False
statsd_host = localhost
statsd_port = 9125
statsd_prefix = airflow

[secrets]
backend =

[providers]
auto_discover = True